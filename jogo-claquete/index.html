<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claquete em Fuga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: fliperama de cinema — placar enxuto no topo, labirinto solto na tela, joystick embaixo */
  :root {
    --bg: #16132b;          /* sala escura */
    --board: #0d0b1e;       /* chão do labirinto */
    --panel: #221d3f;       /* cartões e botões */
    --line: rgba(255, 244, 224, 0.14);
    --gold: #ffc94a;        /* moedas e destaques */
    --cream: #fff4e0;       /* texto */
    --muted: #9d97c2;
    --font-display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .stage {
    max-width: 600px;
    margin: 0 auto;
    padding-block: 12px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header { text-align: center; }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(28px, 7vw, 40px);
    line-height: 1;
    margin: 0;
    color: var(--cream);
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  h1 span { color: var(--gold); }

  /* placar */
  .hud {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
  }
  .score { display: grid; line-height: 1; min-width: 0; }
  .score b {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    color: var(--cream);
  }
  .score small {
    margin-top: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .pill {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--gold);
    white-space: nowrap;
  }
  #lives {
    justify-self: end;
    display: flex;
    gap: 6px;
    align-items: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
  }
  #lives canvas { width: 22px; height: 22px; }

  .board-wrap { position: relative; width: 100%; display: flex; justify-content: center; }
  canvas#board { display: block; touch-action: none; max-width: 100%; }

  /* sobreposições */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .card, .flash {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    text-align: center;
    max-width: min(86%, 330px);
  }
  .card {
    pointer-events: auto;
    padding: 22px 26px;
    display: grid;
    gap: 14px;
  }
  .card h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--cream);
    font-size: 30px;
    line-height: 1.05;
    text-wrap: balance;
  }
  .card h2 span { color: var(--gold); }
  .card p { margin: 0; font-size: 15px; line-height: 1.45; }
  .card .small { font-size: 13px; color: var(--muted); }
  .flash {
    padding: 14px 26px 13px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(24px, 7vw, 32px);
    line-height: 1.1;
    color: var(--cream);
    animation: pop 0.3s ease-out;
  }
  .flash small {
    display: block;
    margin-top: 5px;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 14px;
    color: var(--gold);
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

  button { font: inherit; cursor: pointer; }
  .btn {
    justify-self: center;
    background: var(--gold);
    color: #2a1d00;
    border: 0;
    border-radius: 999px;
    padding: 11px 34px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    box-shadow: 0 4px 0 #c8962a;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c8962a; }
  button:focus-visible, .ghost-btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }

  /* rodapé */
  .controls {
    width: 100%;
    display: grid;
    gap: 10px;
    justify-items: center;
    text-align: center;
  }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ghost-btn {
    background: var(--panel);
    color: var(--cream);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
  }
  .help { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .help a { color: inherit; }

  /* joystick */
  .joyzone {
    display: none;
    width: 100%;
    height: 84px;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .joy {
    display: none;
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--line);
    pointer-events: none;
    flex: none;
  }
  .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24px;
    height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s ease-out;
  }
  .joy.active .knob { transition: none; }
  @media (pointer: coarse) {
    .joyzone { display: flex; }
    .joy { display: block; }
    .stage { padding-block: 6px 16px; gap: 6px; }
    header { display: none; }
    .help .desk { display: none; }
  }
</style>
</head>
<body>

<main class="stage">
  <header>
    <h1>Claquete <span>em Fuga</span></h1>
  </header>

  <div class="hud" aria-live="polite">
    <div class="score"><b id="score">0</b><small>Recorde <span id="best">0</span></small></div>
    <div class="pill" id="scene">Cena 1</div>
    <div id="lives" aria-label="Vidas"></div>
  </div>

  <div class="board-wrap" id="wrap">
    <canvas id="board" aria-label="Labirinto do jogo"></canvas>
    <div id="overlay"></div>
  </div>

  <div class="joyzone" id="joyzone" aria-label="Joystick: encoste e deslize o dedo para mover">
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button class="ghost-btn" id="pauseBtn">Pausar</button>
      <button class="ghost-btn" id="muteBtn">Som: ligado</button>
      <button class="ghost-btn" id="layoutBtn">Labirinto: quadrado</button>
      <label class="ghost-btn" for="faceInput" style="cursor:pointer">Trocar foto</label>
      <input type="file" id="faceInput" accept="image/*" hidden>
    </div>
    <p class="help"><span class="desk">Setas ou WASD para mover · Espaço pausa<br></span>
    Foto: Alan Santos / PR, Agência Brasil, licença <a href="https://creativecommons.org/licenses/by/3.0/br/">CC BY 3.0 BR</a> (recortada)</p>
  </div>
</main>

  document.getElementById("faceInput").addEventListener("change", ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const src = new Image();
      src.onload = () => {
        // recorte quadrado centralizado, puxado para o alto (onde fica o rosto)
        const side = Math.min(src.width, src.height);
        const sx = (src.width - side) / 2;
        const sy = src.height > src.width ? (src.height - side) * 0.2 : 0;
        const c = document.createElement("canvas");
        c.width = c.height = 160;
        c.getContext("2d").drawImage(src, sx, sy, side, side, 0, 0, 160, 160);
        const url = c.toDataURL("image/jpeg", 0.85);
        loadFace(url);
        try { localStorage.setItem("claquete-face", url); } catch (e) {}
      };
      src.src = reader.result;
    };
    reader.readAsDataURL(file);
    ev.target.value = "";
  });

  let actx = null, muted = false;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.05, slideTo = null, delay = 0) {
    const a = actx; if (!a || muted) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function clap() {
    const a = actx; if (!a || muted) return;
    const len = Math.floor(a.sampleRate * 0.12);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    const src = a.createBufferSource(); src.buffer = buf;
    const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const g = a.createGain(); g.gain.value = 0.5;
    src.connect(hp).connect(g).connect(a.destination); src.start();
    tone(140, 0.12, "sine", 0.25, 60);
  }
  let blipFlip = false;
  const sfx = {
    frame() { blipFlip = !blipFlip; tone(blipFlip ? 520 : 660, 0.05, "square", 0.025); },
    coffee() { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.09, "triangle", 0.06, null, i * 0.06)); },
    clock() { tone(300, 0.25, "sawtooth", 0.05, 1400); },
    bonus() { [784, 988, 1175].forEach((f, i) => tone(f, 0.1, "triangle", 0.07, null, i * 0.07)); },
    die() { tone(700, 0.9, "sawtooth", 0.06, 80); },
    clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "triangle", 0.07, null, i * 0.12)); },
  };

  // ---------- Estado ----------
  let grid, dotsLeft, dotsEaten;
  let score = 0, lives = 5, level = 1, take = 1, nextLife = 4000;
  let state = "title"; // title | ready | play | dying | clear | over | paused
  let stateTimer = 0, prevState = null;
  let player, ghosts, frightTimer = 0, chain = 0, freeze = 0;
  let modeIdx = 0, modeTimer = 0, popups = [], bonus = null, bonusSpawns = 0;
  let lifeClock = 0, now = 0;
  const SCHEDULE = [10, 12, 10, 15, 7, Infinity]; // dispersão, perseguição...

  const GHOST_DEFS = [
    { name: "Despertador", color: "#e5484d" },
    { name: "Cronômetro", color: "#b98cf5" },
    { name: "Ampulheta", color: "#3fc1b0" },
    { name: "Bolsonaro", color: "#f08c3a", face: true },
  ];

  function speeds() {
    const k = 1 + Math.min(level - 1, 6) * 0.03;
    // relógios começam lentos e aceleram um pouco a cada cena
    const g = Math.min(3.0 + (level - 1) * 0.25, 4.4);
    return {
      player: 5.0 * k,
      ghost: g,
      fright: 2.2,
      tunnel: 2.5,
      eyes: 11,
      house: 2.5,
    };
  }
  function frightDuration() { return Math.max(4, 11 - (level - 1) * 1.2); }

  function buildGrid() {
    loadMap(level - 1);
    grid = MAP.map(r => r.split(""));
    dotsLeft = 0; dotsEaten = 0;
    for (const row of grid) for (const c of row) if (c === "." || c === "o") dotsLeft++;
    bonusSpawns = 0;
  }

  function cell(x, y) {
    if (y < 0 || y >= ROWS) return "#";
    x = ((x % COLS) + COLS) % COLS;
    return grid[y][x];
  }
  function blocked(x, y, allowDoor) {
    const c = cell(x, y);
    return c === "#" || (c === "-" && !allowDoor);
  }

  function resetPositions() {
    player = { x: START.x, y: START.y, dir: D.left, face: D.left, hflip: true, t: 0, moving: false, next: null };
    const release = [0, 4, 9, 14].map(v => v / (1 + (level - 1) * 0.4));
    const cast = [...scene().cast.map(([kind, color]) => ({ kind, color })), { kind: "face", color: "#f08c3a", face: true }];
    ghosts = cast.slice(0, 4).map((d, i) => {
      const corner = [{ x: COLS - 2, y: -2 }, { x: 1, y: -2 }, { x: COLS - 1, y: ROWS + 1 }, { x: 0, y: ROWS + 1 }][i];
      const g = { ...d, corner, i, t: 0, frightened: false, moving: false, release: release[i] };
      if (i === 0) Object.assign(g, { x: DOOR_OUT.x, y: DOOR_OUT.y, dir: D.left, state: "active", moving: true });
      else Object.assign(g, { x: HOUSE_SLOTS[i - 1], y: HOUSE_Y, dir: D.up, state: "house" });
      return g;
    });
    frightTimer = 0; chain = 0; modeIdx = 0; modeTimer = 0; lifeClock = 0;
    bonus = null; popups = [];
  }

  function newGame() {
    score = 0; lives = 5; level = 1; take = 1; nextLife = 4000;
    buildGrid(); resetPositions(); toReady();
  }

  // cada cena traz um elenco novo de perseguidores e outra cor de cenário
  const FINAL_SCENE = 6;
  const SCENES = [
    { name: "Escala 6x1", wall: "#5868cf", shade: "#323d85", cast: [["clock", "#e5484d"], ["sixone", "#3fa7e0"]] },
    { name: "Câmeras ligadas", wall: "#2fa184", shade: "#1b6150", cast: [["camera", "#f08c3a"], ["clock", "#b98cf5"], ["sixone", "#e86fb0"]] },
    { name: "Rolos e câmeras", wall: "#9a5cc2", shade: "#5c3679", cast: [["reel", "#f2c14e"], ["camera", "#6cb6ff"], ["sixone", "#ff7a6b"]] },
    { name: "Megafones no set", wall: "#de8f3c", shade: "#8c5821", cast: [["mega", "#e5484d"], ["reel", "#4fd1c5"], ["clock", "#7c8cff"]] },
    { name: "Gravação noturna", wall: "#c4506c", shade: "#7a2d43", cast: [["sixone", "#5fd18a"], ["mega", "#7c8cff"], ["camera", "#f2c14e"]] },
    { name: "Cena final", wall: "#3f8fc0", shade: "#24587a", cast: [["clock", "#ff7a6b"], ["mega", "#f2c14e"], ["reel", "#b98cf5"], ["sixone", "#5fd18a"]] },
  ];
  const scene = () => SCENES[(level - 1) % SCENES.length];

  function toReady() {
    state = "ready"; stateTimer = take === 1 ? 2.4 : 2.0;
    renderMaze();
    showFlash(`Cena ${level} de ${FINAL_SCENE}`, take === 1 ? `${scene().name} · Ação!` : `Take ${take} · Ação!`);
    clap();
    updateHud();
  }

  // ---------- Movimento ----------
  function reverse(e) {
    e.x = ((e.x + e.dir.x) % COLS + COLS) % COLS;
    e.y += e.dir.y;
    e.dir = { x: -e.dir.x, y: -e.dir.y };
    e.t = 1 - e.t;
  }
  function advance(e, speed, dt, onTile) {
    e.t += speed * dt;
    let guard = 0;
    while (e.t >= 1 && guard++ < 4) {
      e.t -= 1;
      e.x = ((e.x + e.dir.x) % COLS + COLS) % COLS;
      e.y += e.dir.y;
      onTile(e);
      if (!e.moving) { e.t = 0; break; }
    }
  }
  const same = (a, b) => a && b && a.x === b.x && a.y === b.y;
  const opposite = (a, b) => a && b && a.x === -b.x && a.y === -b.y;

  function updatePlayer(dt) {
    const p = player, sp = speeds().player;
    // direções desejadas: a principal e, na diagonal, a segunda
    const wants = [p.next, p.next2].filter(Boolean);
    const open = (e, d) => !blocked(e.x + d.x, e.y + d.y);
    if (!p.moving) {
      const d = wants.find(d => open(p, d));
      if (!d) return;
      p.dir = d; p.face = d; p.moving = true; p.t = 0;
    } else if (p.next && opposite(p.next, p.dir) && !(p.next2 && same(p.next2, p.dir))) {
      reverse(p); p.face = p.dir;
    } else if (p.t < (p.next2 ? 0.45 : 0.65) && (!p.next2 || p.turnedAt !== p.x + "," + p.y)) {
      // tolerância: virou um pouquinho atrasado, ainda conta a curva (uma vez por cruzamento)
      const d = p.next;
      if (d && !same(d, p.dir) && !opposite(d, p.dir) && open(p, d)) {
        p.dir = d; p.face = d; p.t = 0; p.turnedAt = p.x + "," + p.y;
      }
    }
    advance(p, sp, dt, e => {
      eatAt(e.x, e.y);
      const d = [e.next, e.next2].filter(Boolean).find(d => open(e, d));
      if (d) {
        if (!same(d, e.dir)) e.turnedAt = e.x + "," + e.y;
        e.dir = d; e.face = d;
      }
      if (!open(e, e.dir)) e.moving = false;
    });
  }

  function eatAt(x, y) {
    const c = cell(x, y);
    if (c === ".") {
      grid[y][x] = " "; score += 10; dotsLeft--; dotsEaten++; sfx.frame();
    } else if (c === "o") {
      grid[y][x] = " "; score += 50; dotsLeft--; dotsEaten++; sfx.coffee();
      frightTimer = frightDuration(); chain = 0;
      for (const g of ghosts) if (g.state === "active") { g.frightened = true; reverse(g); }
    }
    // prêmio aparece a cada 30 fotogramas, num lugar aleatório longe da claquete
    if (dotsEaten > 0 && dotsEaten % 30 === 0 && !bonus && (c === "." || c === "o")) {
      const spots = [];
      MAP.forEach((row, yy) => row.split("").forEach((ch, xx) => {
        if ((ch === "." || ch === "o" || ch === "P") && Math.abs(xx - x) + Math.abs(yy - y) >= 5) spots.push({ x: xx, y: yy });
      }));
      if (spots.length) { bonusSpawns++; bonus = { ...spots[Math.floor(Math.random() * spots.length)], time: 12 }; }
    }
    if (bonus && x === bonus.x && y === bonus.y) {
      const pts = Math.min(5000, 300 * level);
      score += pts; addPopup(x, y, String(pts), C.marquee); sfx.bonus(); bonus = null;
    }
    if (score >= nextLife) {
      nextLife += 5000; lives++;
      addPopup(x, y, "+1 vida", "#7ee08a"); sfx.bonus();
    }
    if (dotsLeft <= 0) { state = "clear"; stateTimer = 2.4; sfx.clear(); showFlash(level >= FINAL_SCENE ? "Última cena aprovada!" : "Cena aprovada!", level >= FINAL_SCENE ? "Corta! É um filme!" : `Próxima: ${SCENES[level % SCENES.length].name}`); }
    updateHud();
  }

  function ghostTarget(g) {
    if (g.state === "eaten") return DOOR_OUT;
    const scatter = modeIdx % 2 === 0;
    if (scatter) return g.corner;
    const p = player;
    if (g.i === 0) return { x: p.x, y: p.y };
    if (g.i === 1) return { x: p.x + p.face.x * 4, y: p.y + p.face.y * 4 };
    if (g.i === 2) {
      const dx = g.x - p.x, dy = g.y - p.y;
      return dx * dx + dy * dy > 49 ? { x: p.x, y: p.y } : g.corner;
    }
    const r = ghosts[0];
    const ax = p.x + p.face.x * 2, ay = p.y + p.face.y * 2;
    return { x: ax * 2 - r.x, y: ay * 2 - r.y };
  }

  function chooseDir(g) {
    const opts = ORDER.filter(d => !opposite(d, g.dir) && !blocked(g.x + d.x, g.y + d.y, false));
    if (!opts.length) return { x: -g.dir.x, y: -g.dir.y };
    if (g.frightened) return opts[Math.floor(Math.random() * opts.length)];
    const t = ghostTarget(g);
    let bestD = opts[0], bestV = Infinity;
    for (const d of opts) {
      const nx = g.x + d.x, ny = g.y + d.y;
      const v = (nx - t.x) ** 2 + (ny - t.y) ** 2;
      if (v < bestV) { bestV = v; bestD = d; }
    }
    return bestD;
  }

  function leavingDir(g) {
    if (g.y === HOUSE_Y && g.x < DOOR_OUT.x) return D.right;
    if (g.y === HOUSE_Y && g.x > DOOR_OUT.x) return D.left;
    return D.up;
  }

  function ghostOnTile(g) {
    if (g.state === "leaving") {
      if (g.x === DOOR_OUT.x && g.y === DOOR_OUT.y) {
        g.state = "active"; g.dir = Math.random() < 0.5 ? D.left : D.right;
      } else g.dir = leavingDir(g);
      return;
    }
    if (g.state === "entering") {
      if (g.y >= HOUSE_Y) {
        // descansa no camarim até o café acabar, e mais 2 segundos
        g.state = "house"; g.frightened = false; g.moving = false; g.t = 0; g.dir = D.up;
        g.release = lifeClock + Math.max(frightTimer, 0) + 2;
        g.moving = false;
      }
      return;
    }
    if (g.state === "eaten" && g.x === DOOR_OUT.x && g.y === DOOR_OUT.y) {
      g.state = "entering"; g.dir = D.down; return;
    }
    g.dir = chooseDir(g);
  }

  function updateGhosts(dt) {
    const sp = speeds();
    for (const g of ghosts) {
      if (g.state === "house") {
        if (lifeClock >= g.release) { g.state = "leaving"; g.moving = true; g.t = 0; g.dir = leavingDir(g); }
        continue;
      }
      let s = sp.ghost;
      if (g.state === "eaten" || g.state === "entering") s = sp.eyes;
      else if (g.state === "leaving") s = sp.house;
      else if (g.frightened) s = sp.fright;
      if (g.state === "active" && g.y === TUNNEL_Y && (g.x < TUNNEL_EDGE || g.x >= COLS - TUNNEL_EDGE)) s = Math.min(s, sp.tunnel);
      advance(g, s, dt, ghostOnTile);
    }
  }

  function pos(e) { return { x: e.x + e.dir.x * e.t, y: e.y + e.dir.y * e.t }; }

  function checkCollisions() {
    const pp = pos(player);
    for (const g of ghosts) {
      if (g.state !== "active") continue;
      const gp = pos(g);
      let dx = Math.abs(gp.x - pp.x); if (dx > COLS / 2) dx = COLS - dx;
      const dy = Math.abs(gp.y - pp.y);
      if (dx < 0.5 && dy < 0.5) {
        if (g.frightened) {
          g.frightened = false; g.state = "eaten";
          const pts = 200 * Math.pow(2, chain++);
          score += pts; addPopup(gp.x, gp.y, String(pts), "#9fd8ff");
          sfx.clock(); freeze = 0.45; updateHud();
        } else {
          state = "dying"; stateTimer = 1.6; sfx.die(); clap();
          overlay.innerHTML = ""; return;
        }
      }
    }
  }

  function addPopup(x, y, text, color) { popups.push({ x, y, text, color, t: 1.1 }); }

  // ---------- Loop ----------
  function update(dt) {
    now += dt;
    for (const p of popups) p.t -= dt;
    popups = popups.filter(p => p.t > 0);

    if (state === "ready") {
      stateTimer -= dt;
      if (stateTimer <= 0) { state = "play"; overlay.innerHTML = ""; }
      return;
    }
    if (state === "dying") {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        lives--;
        if (lives <= 0) return gameOver();
        take++; resetPositions(); toReady();
      }
      return;
    }
    if (state === "clear") {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        if (level >= FINAL_SCENE) return premiere();
        level++; take = 1; buildGrid(); resetPositions(); toReady();
      }
      return;
    }
    if (state !== "play") return;
    if (freeze > 0) { freeze -= dt; return; }

    lifeClock += dt;
    if (frightTimer > 0) {
      frightTimer -= dt;
      if (frightTimer <= 0) { for (const g of ghosts) g.frightened = false; }
    } else {
      modeTimer += dt;
      if (modeTimer >= SCHEDULE[modeIdx]) {
        modeTimer = 0; modeIdx = Math.min(modeIdx + 1, SCHEDULE.length - 1);
        for (const g of ghosts) if (g.state === "active") reverse(g);
      }
    }
    if (bonus) { bonus.time -= dt; if (bonus.time <= 0) bonus = null; }

    updatePlayer(dt);
    if (state !== "play") return;
    checkCollisions();
    if (state !== "play") return;
    updateGhosts(dt);
    checkCollisions();
  }

  function premiere() {
    state = "won";
    const bonusLives = lives * 1000;
    score += bonusLives;
    const record = score > best;
    if (record) { best = score; saveBest(); }
    updateHud(); sfx.clear();
    overlay.innerHTML = `
      <div class="card">
        <h2>Filme <span>pronto!</span></h2>
        <p>Estreia com <b>${score}</b> pontos.</p>
        <p class="small">Bônus de ${lives} ${lives === 1 ? "vida" : "vidas"}: +${bonusLives}${record ? " · Novo recorde!" : ""}</p>
        <button class="btn" id="startBtn">Novo filme</button>
      </div>`;
    document.getElementById("startBtn").addEventListener("click", start);
  }

  function gameOver() {
    state = "over";
    const record = score > best;
    if (record) { best = score; saveBest(); }
    updateHud();
    overlay.innerHTML = `
      <div class="card">
        <h2>Corta!</h2>
        <p>Os prazos venceram desta vez. Você chegou à cena ${level} com <b>${score}</b> pontos.</p>
        ${record ? `<p class="small">Novo recorde do estúdio.</p>` : `<p class="small">Recorde: ${best}</p>`}
        <button class="btn" id="startBtn">Novo take</button>
      </div>`;
    document.getElementById("startBtn").addEventListener("click", start);
  }

  function showFlash(big, small) {
    overlay.innerHTML = `<div class="flash">${big}<small>${small}</small></div>`;
  }

  function titleScreen() {
    overlay.innerHTML = `
      <div class="card">
        <h2>Claquete <span>em Fuga</span></h2>
        <button class="btn" id="startBtn">Ação!</button>
      </div>`;
    document.getElementById("startBtn").addEventListener("click", start);
  }

  function start() {
    audio();
    try { window.focus(); } catch (e) {}
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    newGame();
  }

  function togglePause() {
    if (state === "play") {
      prevState = state; state = "paused";
      overlay.innerHTML = `<div class="card"><h2>Intervalo</h2><p class="small">Clique no botão ou aperte espaço para voltar.</p><button class="btn" id="resumeBtn">Voltar ao set</button></div>`;
      document.getElementById("resumeBtn").addEventListener("click", togglePause);
      pauseBtn.textContent = "Continuar";
    } else if (state === "paused") {
      state = prevState || "play"; overlay.innerHTML = ""; pauseBtn.textContent = "Pausar";
    }
  }

  function updateHud() {
    elScore.textContent = score;
    elBest.textContent = Math.max(best, score);
    elScene.textContent = take > 1 ? `Cena ${level} · Take ${take}` : `Cena ${level}`;
    const want = Math.max(0, lives);
    if (!elLives.firstChild) {
      const c = document.createElement("canvas");
      c.width = 40; c.height = 40;
      const x = c.getContext("2d");
      x.scale(2, 2);
      drawClapper(x, 10, 10, 18, false, 0, 0.25);
      const t = document.createElement("span");
      t.id = "livesN";
      elLives.append(c, t);
    }
    document.getElementById("livesN").textContent = "×" + want;
  }

  // ---------- Desenho ----------
  function resize() {
    const availW = wrap.clientWidth;
    const coarse = matchMedia("(pointer: coarse)").matches;
    // o labirinto inteiro sempre cabe na tela, sem nada se mexer
    const availH = Math.max(300, window.innerHeight - (coarse ? 140 : 240));
    viewCols = COLS; viewRows = ROWS;
    tile = Math.max(10, Math.floor(Math.min(availW / COLS, availH / ROWS, 32) * 2) / 2);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = tile * viewCols, H = tile * viewRows;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    renderMaze();
  }

  function renderMaze() {
    const W = tile * COLS, H = tile * ROWS;
    mazeCanvas = document.createElement("canvas");
    mazeCanvas.width = W * dpr; mazeCanvas.height = H * dpr;
    const m = mazeCanvas.getContext("2d");
    m.scale(dpr, dpr);
    // fora do labirinto fica a cor da página; a parede de fora é só uma faixa fina
    const edge = tile * 0.4;
    m.fillStyle = C.bg; m.fillRect(0, 0, W, H);
    m.fillStyle = C.board;
    roundRect(m, edge, edge, W - edge * 2, H - edge * 2, tile * 0.5); m.fill();
    const isWall = (x, y) => {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
      return MAP[y][x] === "#";
    };
    // paredes arredondadas e emendadas, como balas de goma
    const ins = tile * 0.17, R = tile * 0.3;
    const shape = (x, y, off) => {
      const u = isWall(x, y - 1), d = isWall(x, y + 1), l = isWall(x - 1, y), r = isWall(x + 1, y);
      // emendas sobrepostas meio pixel para não aparecerem riscos entre blocos
      const x0 = x * tile + (l ? -0.5 : ins), x1 = (x + 1) * tile - (r ? -0.5 : ins);
      const y0 = y * tile + (u ? -0.5 : ins) + off, y1 = (y + 1) * tile - (d ? -0.5 : ins) + off;
      let X0 = x0, X1 = x1, Y0 = y0, Y1 = y1;
      if (x === 0) X0 = Math.max(X0, edge); if (x === COLS - 1) X1 = Math.min(X1, W - edge);
      if (y === 0) Y0 = Math.max(Y0, edge + off); if (y === ROWS - 1) Y1 = Math.min(Y1, H - edge + off);
      const cornerTL = x === 0 && y === 0, cornerTR = x === COLS - 1 && y === 0;
      const cornerBR = x === COLS - 1 && y === ROWS - 1, cornerBL = x === 0 && y === ROWS - 1;
      const tl = (!u && !l) || cornerTL ? R : 0, tr = (!u && !r) || cornerTR ? R : 0;
      const br = (!d && !r) || cornerBR ? R : 0, bl = (!d && !l) || cornerBL ? R : 0;
      m.beginPath();
      m.moveTo(X0 + tl, Y0);
      m.lineTo(X1 - tr, Y0); if (tr) m.arcTo(X1, Y0, X1, Y0 + tr, tr);
      m.lineTo(X1, Y1 - br); if (br) m.arcTo(X1, Y1, X1 - br, Y1, br);
      m.lineTo(X0 + bl, Y1); if (bl) m.arcTo(X0, Y1, X0, Y1 - bl, bl);
      m.lineTo(X0, Y0 + tl); if (tl) m.arcTo(X0, Y0, X0 + tl, Y0, tl);
      m.closePath(); m.fill();
    };
    const sc = scene();
    m.fillStyle = sc.shade;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (isWall(x, y)) shape(x, y, tile * 0.1);
    m.fillStyle = sc.wall;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (isWall(x, y)) shape(x, y, 0);
    // cantos de dentro: tira o "dentinho" quadrado e arredonda a curva
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!isWall(x, y)) continue;
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        if (!(isWall(x + dx, y) && isWall(x, y + dy) && !isWall(x + dx, y + dy))) continue;
        const cx = dx > 0 ? (x + 1) * tile : x * tile, cy = dy > 0 ? (y + 1) * tile : y * tile;
        const sx = cx - (dx > 0 ? ins : 0), sy = cy - (dy > 0 ? ins : 0);
        m.fillStyle = C.board; m.fillRect(sx, sy, ins, ins + (dy > 0 ? tile * 0.12 : 0));
        // filete arredondado
        m.fillStyle = sc.wall;
        m.beginPath();
        const px = cx - dx * ins, py = cy - dy * ins;
        m.moveTo(px, py);
        m.lineTo(cx, py);
        m.arc(cx, cy, ins, dy > 0 ? (dx > 0 ? -Math.PI / 2 : -Math.PI / 2) : Math.PI / 2, dx > 0 ? Math.PI : 0, (dx > 0) === (dy > 0));
        m.closePath();
        m.fill();
      }
    }
    // brilho nas bordas de cima
    m.strokeStyle = "rgba(255,255,255,0.18)"; m.lineWidth = Math.max(1, tile * 0.06); m.lineCap = "round";
    m.beginPath();
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!isWall(x, y) || isWall(x, y - 1)) continue;
      const l = isWall(x - 1, y) && !isWall(x - 1, y - 1), r = isWall(x + 1, y) && !isWall(x + 1, y - 1);
      const y0 = y * tile + ins + tile * 0.08;
      m.moveTo(x * tile + (l ? 0 : ins + R * 0.7), y0); m.lineTo((x + 1) * tile - (r ? 0 : ins + R * 0.7), y0);
    }
    m.stroke();
    // porta do camarim
    const dx = DOOR.x * tile, dy = DOOR.y * tile;
    m.fillStyle = C.marquee;
    roundRect(m, dx - tile * 0.1, dy + tile * 0.38, tile * 1.2, tile * 0.24, tile * 0.12); m.fill();
    // placa do camarim
    m.fillStyle = "#fff";
    m.font = `600 ${Math.max(7, tile * 0.38)}px Fredoka, Nunito, sans-serif`;
    m.textAlign = "center"; m.textBaseline = "middle";
    m.fillText("CAMARIM", (DOOR.x + 0.5) * tile, (HOUSE_Y + 1.5) * tile);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function stripedBar(c, x, y, w, h) {
    c.save();
    c.beginPath(); c.rect(x, y, w, h); c.clip();
    c.fillStyle = "#f6f1e7"; c.fillRect(x, y, w, h);
    c.fillStyle = "#2b2b33";
    const sw = h * 0.9;
    for (let i = -h * 2; i < w + h; i += sw * 2) {
      c.beginPath();
      c.moveTo(x + i, y + h);
      c.lineTo(x + i + sw, y + h);
      c.lineTo(x + i + sw + h, y);
      c.lineTo(x + i + h, y);
      c.closePath(); c.fill();
    }
    c.restore();
    c.strokeStyle = "#f6f1e7"; c.lineWidth = Math.max(0.8, h * 0.12);
    c.strokeRect(x, y, w, h);
  }

  // A claquete: corpo vermelho com carinha + haste listrada que abre e fecha
  function drawClapper(c, cx, cy, s, flip, tilt, open, spin = 0, scale = 1) {
    c.save();
    c.translate(cx, cy);
    if (spin) c.rotate(spin);
    if (scale !== 1) c.scale(scale, scale);
    if (flip) c.scale(-1, 1);
    if (tilt) c.rotate(tilt);
    c.translate(0, s * 0.06);
    const L = -s * 0.42, W = s * 0.84, top = -s * 0.1, h = s * 0.46;
    // sombra
    c.fillStyle = "rgba(0,0,0,0.3)";
    roundRect(c, L + s * 0.03, top + s * 0.06, W, h, s * 0.08); c.fill();
    // corpo
    c.fillStyle = "#d8434f";
    roundRect(c, L, top, W, h, s * 0.08); c.fill();
    c.strokeStyle = "#f6f1e7"; c.lineWidth = Math.max(1, s * 0.055); c.stroke();
    // linhas de giz (CENA / TAKE / ROLO)
    c.strokeStyle = "rgba(246,241,231,0.85)"; c.lineWidth = Math.max(0.7, s * 0.03);
    c.beginPath();
    c.moveTo(L + s * 0.07, top + h * 0.38); c.lineTo(L + W - s * 0.07, top + h * 0.38);
    c.moveTo(L + s * 0.07, top + h * 0.7); c.lineTo(L + W - s * 0.07, top + h * 0.7);
    c.moveTo(0, top + h * 0.38); c.lineTo(0, top + h * 0.9);
    c.stroke();
    // haste fixa
    stripedBar(c, L, -s * 0.22, W, s * 0.12);
    // haste móvel (dobradiça à esquerda)
    c.save();
    c.translate(L, -s * 0.22);
    c.rotate(-open * 0.7);
    stripedBar(c, 0, -s * 0.12, W, s * 0.12);
    c.restore();
    c.fillStyle = C.marquee;
    c.beginPath(); c.arc(L + s * 0.03, -s * 0.22, s * 0.05, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // Caricatura desenhada: o perseguidor político do set
  function drawFace(c, g, cx, cy, s) {
    const r = s * 0.36;
    const flashing = g.frightened && frightTimer < 2 && Math.floor(now * 6) % 2 === 0;
    const eyesOnly = g.state === "eaten" || g.state === "entering";
    const ink = "#1b1720";
    c.save();
    c.translate(cx, cy);
    if (g.state === "house") c.translate(0, Math.sin(now * 5 + g.i) * s * 0.08);
    if (g.state === "active" && !g.frightened) c.rotate(Math.sin(now * 7) * 0.06);
    if (!eyesOnly) {
      // terno + faixa presidencial
      c.save();
      c.beginPath(); c.ellipse(0, r * 1.08, r * 0.98, r * 0.42, 0, Math.PI, 0); c.closePath();
      c.fillStyle = g.frightened ? "#26306f" : "#2a2f3a"; c.fill();
      if (!g.frightened) {
        c.clip();
        c.lineWidth = r * 0.22;
        c.strokeStyle = "#1f9d55";
        c.beginPath(); c.moveTo(-r, r * 0.62); c.lineTo(r, r * 1.2); c.stroke();
        c.lineWidth = r * 0.09; c.strokeStyle = "#f5d020";
        c.beginPath(); c.moveTo(-r, r * 0.62); c.lineTo(r, r * 1.2); c.stroke();
      }
      c.restore();
      if (faceImg) {
        const R = r * 1.15;
        c.save();
        c.beginPath(); c.arc(0, -r * 0.05, R, 0, Math.PI * 2); c.clip();
        c.drawImage(faceImg, -R, -r * 0.05 - R, R * 2, R * 2);
        if (g.frightened) {
          c.globalAlpha = 0.6;
          c.fillStyle = flashing ? "#f3ede2" : "#3b4cc0";
          c.fillRect(-R, -r * 0.05 - R, R * 2, R * 2);
        }
        c.restore();
        c.strokeStyle = g.frightened ? "#c9d2ff" : g.color;
        c.lineWidth = Math.max(1.2, s * 0.06);
        c.beginPath(); c.arc(0, -r * 0.05, R, 0, Math.PI * 2); c.stroke();
        c.restore();
        return;
      }
      const skin = g.frightened ? (flashing ? "#f3ede2" : "#3b4cc0") : "#e8b38e";
      // orelhas
      c.fillStyle = skin;
      for (const sx of [-1, 1]) {
        c.beginPath(); c.ellipse(sx * r * 0.78, r * 0.02, r * 0.14, r * 0.22, 0, 0, Math.PI * 2); c.fill();
      }
      // cabeça
      c.beginPath(); c.ellipse(0, 0, r * 0.76, r * 0.92, 0, 0, Math.PI * 2); c.fill();
      // cabelo grisalho repartido de lado
      c.fillStyle = g.frightened ? (flashing ? "#e5484d" : "#26306f") : "#6b6866";
      c.beginPath();
      c.moveTo(-r * 0.8, -r * 0.12);
      c.quadraticCurveTo(-r * 0.88, -r * 1.02, -r * 0.1, -r * 1.02);
      c.quadraticCurveTo(r * 0.78, -r * 1.04, r * 0.82, -r * 0.22);
      c.quadraticCurveTo(r * 0.62, -r * 0.7, -r * 0.08, -r * 0.62);
      c.quadraticCurveTo(-r * 0.55, -r * 0.58, -r * 0.8, -r * 0.12);
      c.fill();
      if (!g.frightened) {
        c.strokeStyle = "#b9b4ad"; c.lineWidth = Math.max(0.6, s * 0.02);
        c.beginPath(); c.moveTo(-r * 0.38, -r * 0.98); c.quadraticCurveTo(-r * 0.3, -r * 0.8, -r * 0.2, -r * 0.62); c.stroke();
      }
    }
    const ex = r * 0.3, ey = -r * 0.16;
    if (g.frightened && !eyesOnly) {
      c.fillStyle = flashing ? "#e5484d" : "#c9d2ff";
      c.beginPath(); c.arc(-ex, ey, r * 0.09, 0, Math.PI * 2); c.arc(ex, ey, r * 0.09, 0, Math.PI * 2); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = Math.max(0.8, s * 0.035);
      c.beginPath();
      for (let k = 0; k <= 4; k++) {
        const x = -r * 0.34 + k * r * 0.17, y = r * 0.45 + (k % 2 ? -r * 0.07 : r * 0.04);
        k ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    } else {
      if (!eyesOnly) {
        // sobrancelhas grossas e franzidas
        c.strokeStyle = "#3d3a38"; c.lineWidth = Math.max(1, r * 0.13); c.lineCap = "round";
        c.beginPath();
        c.moveTo(-r * 0.5, -r * 0.42); c.lineTo(-r * 0.14, -r * 0.33);
        c.moveTo(r * 0.5, -r * 0.42); c.lineTo(r * 0.14, -r * 0.33);
        c.stroke();
      }
      c.fillStyle = "#fff"; c.strokeStyle = ink; c.lineWidth = Math.max(0.6, s * 0.025);
      for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * ex, ey, r * 0.16, 0, Math.PI * 2); c.fill(); c.stroke(); }
      c.fillStyle = eyesOnly ? "#2d6cdf" : ink;
      const d = g.dir || D.left;
      for (const sx of [-1, 1]) {
        c.beginPath(); c.arc(sx * ex + d.x * r * 0.06, ey + d.y * r * 0.06, r * 0.08, 0, Math.PI * 2); c.fill();
      }
      if (!eyesOnly) {
        // nariz e boca
        c.strokeStyle = "#a8735a"; c.lineWidth = Math.max(0.8, s * 0.03);
        c.beginPath(); c.moveTo(0, -r * 0.05); c.lineTo(-r * 0.06, r * 0.18); c.lineTo(r * 0.04, r * 0.2); c.stroke();
        c.strokeStyle = "#7a3b32"; c.lineWidth = Math.max(1, s * 0.04);
        c.beginPath(); c.moveTo(-r * 0.26, r * 0.48); c.quadraticCurveTo(0, r * 0.36, r * 0.26, r * 0.48); c.stroke();
      }
    }
    c.restore();
  }

  // olhos e boca comuns a todos os perseguidores
  function drawEyes(c, g, r, ex, ey, er, flashing, eyesOnly) {
    const ink = "#1b1720";
    if (g.frightened && !eyesOnly) {
      c.fillStyle = flashing ? "#e5484d" : "#e8ecff";
      c.beginPath(); c.arc(-ex, ey, er * 0.5, 0, Math.PI * 2); c.arc(ex, ey, er * 0.5, 0, Math.PI * 2); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = Math.max(0.8, r * 0.1);
      c.beginPath();
      for (let k = 0; k <= 4; k++) {
        const x = -ex * 1.1 + k * ex * 0.55, y = ey + er * 2.1 + (k % 2 ? -er * 0.35 : er * 0.2);
        k ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
      return;
    }
    c.fillStyle = "#fff"; c.strokeStyle = ink; c.lineWidth = Math.max(0.6, r * 0.07);
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * ex, ey, er, 0, Math.PI * 2); c.fill(); c.stroke(); }
    c.fillStyle = eyesOnly ? "#2d6cdf" : ink;
    const d = g.dir || D.left;
    for (const sx of [-1, 1]) {
      c.beginPath(); c.arc(sx * ex + d.x * er * 0.4, ey + d.y * er * 0.4, er * 0.5, 0, Math.PI * 2); c.fill();
    }
  }

  function drawEnemy(c, g, cx, cy, s) {
    if (g.face) return drawFace(c, g, cx, cy, s);
    if (g.kind === "clock") return drawClock(c, g, cx, cy, s);
    const r = s * 0.36;
    const flashing = g.frightened && frightTimer < 2 && Math.floor(now * 6) % 2 === 0;
    const eyesOnly = g.state === "eaten" || g.state === "entering";
    const body = g.frightened ? (flashing ? "#f3ede2" : "#3b4cc0") : g.color;
    const dark = g.frightened ? "#26306f" : "#1b1720";
    const trim = g.frightened ? "#c9d2ff" : "#efe7d6";
    c.save();
    c.translate(cx, cy);
    if (g.state === "house") c.translate(0, Math.sin(now * 5 + g.i) * s * 0.08);
    const flip = (g.dir && g.dir.x < 0) ? -1 : 1;
    if (!eyesOnly) {
      if (g.kind === "camera") {
        // dois rolos em cima, corpo e lente
        for (const [x, y, rr] of [[-0.42, -0.62, 0.36], [0.3, -0.66, 0.32]]) {
          c.fillStyle = trim;
          c.beginPath(); c.arc(x * r * flip, y * r, rr * r, 0, Math.PI * 2); c.fill();
          c.fillStyle = body;
          c.beginPath(); c.arc(x * r * flip, y * r, rr * r * 0.4, 0, Math.PI * 2); c.fill();
        }
        c.fillStyle = body;
        roundRect(c, -r * 0.9, -r * 0.3, r * 1.5, r * 1.05, r * 0.2); c.fill();
        c.fillStyle = trim;
        c.beginPath();
        c.moveTo(r * 0.6 * flip, r * 0.0); c.lineTo(r * 1.05 * flip, -r * 0.18);
        c.lineTo(r * 1.05 * flip, r * 0.62); c.lineTo(r * 0.6 * flip, r * 0.45); c.closePath(); c.fill();
        c.translate(-r * 0.15 * flip, r * 0.08);
      } else if (g.kind === "sixone") {
        // plaquinha com "6x1" grande e legível
        const w = r * 2.3, h = r * 1.35, y0 = -r * 0.35;
        c.fillStyle = "rgba(0,0,0,0.3)";
        roundRect(c, -w / 2 + r * 0.08, y0 + r * 0.12, w, h, r * 0.35); c.fill();
        c.fillStyle = body;
        roundRect(c, -w / 2, y0, w, h, r * 0.35); c.fill();
        c.strokeStyle = g.frightened ? "#c9d2ff" : "#fff4e0"; c.lineWidth = Math.max(1, r * 0.12); c.stroke();
        if (!g.frightened) {
          c.font = `700 ${r * 1.15}px Fredoka, Nunito, sans-serif`;
          c.textAlign = "center"; c.textBaseline = "middle";
          c.lineJoin = "round"; c.lineWidth = Math.max(1.5, r * 0.22); c.strokeStyle = "rgba(0,0,0,0.45)";
          c.strokeText("6x1", 0, y0 + h * 0.56);
          c.fillStyle = "#fff";
          c.fillText("6x1", 0, y0 + h * 0.56);
        }
      } else if (g.kind === "reel") {
        // rolo de filme girando
        c.fillStyle = body;
        c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
        c.fillStyle = dark;
        const rot = now * (g.frightened ? 1 : 4) * flip;
        for (let k = 0; k < 6; k++) {
          const a = rot + k * Math.PI / 3;
          c.beginPath(); c.arc(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7, r * 0.17, 0, Math.PI * 2); c.fill();
        }
        c.fillStyle = g.frightened ? "#c9d2ff" : "#f6eedd";
        c.beginPath(); c.arc(0, 0, r * 0.5, 0, Math.PI * 2); c.fill();
      } else if (g.kind === "mega") {
        // megafone do diretor
        c.fillStyle = trim;
        c.fillRect(-r * 0.15 * flip - r * 0.1, r * 0.3, r * 0.2, r * 0.6);
        c.fillStyle = body;
        c.beginPath();
        c.moveTo(-r * 0.95 * flip, -r * 0.28); c.lineTo(r * 0.75 * flip, -r * 0.85);
        c.lineTo(r * 0.75 * flip, r * 0.85); c.lineTo(-r * 0.95 * flip, r * 0.28); c.closePath(); c.fill();
        c.fillStyle = trim;
        c.beginPath(); c.ellipse(r * 0.8 * flip, 0, r * 0.18, r * 0.88, 0, 0, Math.PI * 2); c.fill();
        c.translate(-r * 0.15 * flip, 0);
      }
    }
    const small = g.kind === "reel" ? 0.8 : g.kind === "sixone" ? 1.15 : 1;
    const eyeY = g.kind === "sixone" && !eyesOnly ? -r * 0.68 : -r * 0.08;
    drawEyes(c, g, r, r * 0.26 * small, eyeY, r * 0.17 * small, flashing, eyesOnly);
    c.restore();
  }

  function drawClock(c, g, cx, cy, s) {
    const r = s * 0.34;
    const flashing = g.frightened && frightTimer < 2 && Math.floor(now * 6) % 2 === 0;
    c.save();
    c.translate(cx, cy);
    if (g.state === "house") c.translate(0, Math.sin(now * 5 + g.i) * s * 0.08);
    if (g.state === "active" && !g.frightened) c.rotate(Math.sin(now * 38 + g.i) * 0.07);
    const eyesOnly = g.state === "eaten" || g.state === "entering";
    const body = g.frightened ? (flashing ? "#f3ede2" : "#3b4cc0") : g.color;
    const face = g.frightened ? (flashing ? "#e5484d" : "#c9d2ff") : "#f6eedd";
    const ink = "#1b1720";
    if (!eyesOnly) {
      // pés
      c.strokeStyle = body; c.lineWidth = Math.max(1, s * 0.08); c.lineCap = "round";
      c.beginPath();
      c.moveTo(-r * 0.5, r * 0.75); c.lineTo(-r * 0.8, r * 1.15);
      c.moveTo(r * 0.5, r * 0.75); c.lineTo(r * 0.8, r * 1.15);
      c.stroke();
      // sinos
      c.fillStyle = body;
      for (const sx of [-1, 1]) {
        c.beginPath(); c.arc(sx * r * 0.66, -r * 0.8, r * 0.36, Math.PI, 0); c.closePath(); c.fill();
      }
      c.strokeStyle = body; c.lineWidth = Math.max(1, s * 0.05);
      c.beginPath(); c.moveTo(0, -r); c.lineTo(0, -r * 1.25); c.stroke();
      c.beginPath(); c.arc(0, -r * 1.3, r * 0.12, 0, Math.PI * 2); c.fill();
      // caixa
      c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = face;
      c.beginPath(); c.arc(0, 0, r * 0.76, 0, Math.PI * 2); c.fill();
      // marcações
      c.fillStyle = ink;
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2;
        c.beginPath(); c.arc(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.06, 0, Math.PI * 2); c.fill();
      }
    }
    // ponteiros
    c.strokeStyle = eyesOnly ? "rgba(243,237,226,0.6)" : ink;
    c.lineWidth = Math.max(0.8, s * 0.045); c.lineCap = "round";
    const ma = now * (g.frightened ? 0.3 : 7) + g.i, ha = now * 0.6 + g.i * 2;
    c.beginPath();
    c.moveTo(0, r * 0.08); c.lineTo(Math.sin(ma) * r * 0.58, r * 0.08 - Math.cos(ma) * r * 0.58);
    c.moveTo(0, r * 0.08); c.lineTo(Math.sin(ha) * r * 0.36, r * 0.08 - Math.cos(ha) * r * 0.36);
    c.stroke();
    // olhos
    const ex = r * 0.3, ey = -r * 0.25;
    if (g.frightened) {
      c.fillStyle = flashing ? "#f3ede2" : "#26306f";
      c.beginPath(); c.arc(-ex, ey, r * 0.09, 0, Math.PI * 2); c.arc(ex, ey, r * 0.09, 0, Math.PI * 2); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = Math.max(0.8, s * 0.035);
      c.beginPath();
      for (let k = 0; k <= 4; k++) {
        const x = -r * 0.36 + k * r * 0.18, y = r * 0.42 + (k % 2 ? -r * 0.07 : r * 0.04);
        k ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    } else {
      c.fillStyle = "#fff";
      c.strokeStyle = ink; c.lineWidth = Math.max(0.6, s * 0.025);
      for (const sx of [-1, 1]) {
        c.beginPath(); c.arc(sx * ex, ey, r * 0.2, 0, Math.PI * 2); c.fill(); c.stroke();
      }
      c.fillStyle = eyesOnly ? "#2d6cdf" : ink;
      const d = g.dir || D.left;
      for (const sx of [-1, 1]) {
        c.beginPath(); c.arc(sx * ex + d.x * r * 0.08, ey + d.y * r * 0.08, r * 0.1, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }

  function drawCoffee(c, cx, cy, s) {
    const k = 1 + Math.sin(now * 6) * 0.08;
    c.save(); c.translate(cx, cy); c.scale(k, k);
    // vapor
    c.strokeStyle = "rgba(243,237,226,0.7)"; c.lineWidth = Math.max(0.8, s * 0.04); c.lineCap = "round";
    for (const ox of [-0.1, 0.08]) {
      c.beginPath();
      for (let i = 0; i <= 6; i++) {
        const y = -s * 0.18 - i * s * 0.04;
        const x = ox * s + Math.sin(now * 5 + i * 0.9 + ox * 20) * s * 0.035;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    }
    // xícara
    c.fillStyle = "#f6f1e7";
    roundRect(c, -s * 0.2, -s * 0.12, s * 0.34, s * 0.3, s * 0.07); c.fill();
    c.strokeStyle = "#f6f1e7"; c.lineWidth = Math.max(1, s * 0.05);
    c.beginPath(); c.arc(s * 0.15, s * 0.02, s * 0.07, -Math.PI / 2, Math.PI / 2); c.stroke();
    c.fillStyle = "#6b3e1f";
    c.fillRect(-s * 0.17, -s * 0.1, s * 0.28, s * 0.05);
    c.fillStyle = C.marquee;
    c.fillRect(-s * 0.26, s * 0.18, s * 0.46, s * 0.04);
    c.restore();
  }

  function drawPopcorn(c, cx, cy, s) {
    c.save(); c.translate(cx, cy + Math.sin(now * 4) * s * 0.04);
    c.fillStyle = "#ffe08a";
    for (const [x, y, r] of [[-0.14, -0.2, 0.1], [0, -0.26, 0.11], [0.14, -0.2, 0.1], [-0.06, -0.12, 0.09], [0.08, -0.12, 0.09]]) {
      c.beginPath(); c.arc(x * s, y * s, r * s, 0, Math.PI * 2); c.fill();
    }
    c.beginPath();
    c.moveTo(-s * 0.24, -s * 0.12); c.lineTo(s * 0.24, -s * 0.12);
    c.lineTo(s * 0.17, s * 0.32); c.lineTo(-s * 0.17, s * 0.32); c.closePath();
    c.save(); c.clip();
    c.fillStyle = "#f6f1e7"; c.fillRect(-s * 0.3, -s * 0.2, s * 0.6, s * 0.6);
    c.fillStyle = "#d8343c";
    for (let i = -3; i <= 3; i += 2) c.fillRect(i * s * 0.06 - s * 0.03, -s * 0.2, s * 0.06, s * 0.6);
    c.restore();
    c.restore();
  }

  function draw() {
    const W = tile * COLS, H = tile * ROWS;
    const VW = tile * viewCols, VH = tile * viewRows;
    let camX = 0, camY = 0;
    if (viewCols < COLS || viewRows < ROWS) {
      const pp = pos(player);
      camX = Math.max(0, Math.min(W - VW, (pp.x + 0.5) * tile - VW / 2));
      camY = Math.max(0, Math.min(H - VH, (pp.y + 0.5) * tile - VH / 2));
      camX = Math.round(camX * dpr) / dpr; camY = Math.round(camY * dpr) / dpr;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.board; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(mazeCanvas, -camX * dpr, -camY * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, -camX * dpr, -camY * dpr);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    // fotogramas e café
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const c = grid[y][x];
      const cx = (x + 0.5) * tile, cy = (y + 0.5) * tile;
      if (c === ".") {
        // moeda dourada girando devagar
        const r = tile * 0.14;
        const sx = 0.55 + 0.45 * Math.abs(Math.cos(now * 2.2 + (x + y) * 0.6));
        ctx.save(); ctx.translate(cx, cy); ctx.scale(sx, 1);
        ctx.fillStyle = "#b8862a";
        ctx.beginPath(); ctx.arc(0, r * 0.12, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f5c84c";
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#c9952f"; ctx.lineWidth = Math.max(0.8, r * 0.18);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.38, r * 0.2, r * 0.12, -0.8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (c === "o") {
        drawCoffee(ctx, cx, cy, tile * 1.4);
      }
    }
    if (bonus && (bonus.time > 2 || Math.floor(now * 8) % 2 === 0)) {
      drawPopcorn(ctx, (bonus.x + 0.5) * tile, (bonus.y + 0.5) * tile, tile * 1.25);
    }

    // relógios
    {
      if (!(state === "dying" && stateTimer < 1.2) && state !== "clear") {
        for (const g of ghosts) {
          const p = pos(g);
          drawEnemy(ctx, g, (p.x + 0.5) * tile, (p.y + 0.5) * tile, tile * (g.face ? 1.35 : 1.25));
        }
      }
      // claquete
      const p = pos(player);
      const cx = (p.x + 0.5) * tile, cy = (p.y + 0.5) * tile;
      if (state === "dying") {
        const k = Math.min(1, (1.6 - stateTimer) / 1.2);
        drawClapper(ctx, cx, cy, tile * 1.25, player.hflip, 0, k < 0.2 ? 1 - k * 5 : 0, k * Math.PI * 2, Math.max(0.01, 1 - k));
      } else {
        if (player.face.x) player.hflip = player.face.x < 0;
        const open = (state === "play" && player.moving) ? (Math.sin(now * 20) + 1) / 2 : 0.35;
        drawClapper(ctx, cx, cy, tile * 1.25, player.hflip, player.face.y * 0.3, open);
      }
    }

    // pontuações flutuantes
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 ${Math.max(10, tile * 0.55)}px Fredoka, Nunito, sans-serif`;
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.t * 2);
      ctx.fillStyle = "#000";
      ctx.fillText(p.text, (p.x + 0.5) * tile + 1, (p.y + 0.5 - (1.1 - p.t) * 0.8) * tile + 1);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, (p.x + 0.5) * tile, (p.y + 0.5 - (1.1 - p.t) * 0.8) * tile);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Controles ----------
  const KEYMAP = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
  };
  function steer(name, second) {
    if (!player) return;
    player.next = D[name];
    player.next2 = second ? D[second] : null;
  }
  window.addEventListener("keydown", e => {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      if (state === "title" || state === "over" || state === "won") return;
      steer(KEYMAP[e.key]);
    } else if (e.key === " " || e.key === "p" || e.key === "P" || e.key === "Escape") {
      if (state === "play" || state === "paused") { e.preventDefault(); togglePause(); }
    } else if (e.key === "Enter" && (state === "title" || state === "over" || state === "won")) {
      e.preventDefault(); start();
    }
  });

  let touch0 = null;
  canvas.addEventListener("touchstart", e => {
    const t = e.changedTouches[0]; touch0 = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchmove", e => {
    if (!touch0) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 18) {
      steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      touch0 = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });
  canvas.addEventListener("touchend", () => { touch0 = null; });

  // joystick: a direção vale a partir de onde o dedo encostou; um deslize curto já vira
  const zone = document.getElementById("joyzone"), joy = document.getElementById("joy"), knob = document.getElementById("knob");
  let joyId = null, joyDir = null, ox = 0, oy = 0;
  const DEAD = 6, LEASH = 16;
  function joyMove(e) {
    let dx = e.clientX - ox, dy = e.clientY - oy;
    let len = Math.hypot(dx, dy);
    // a origem acompanha o dedo, então trocar de direção pede pouco movimento
    if (len > LEASH) {
      ox = e.clientX - dx / len * LEASH; oy = e.clientY - dy / len * LEASH;
      dx = e.clientX - ox; dy = e.clientY - oy; len = LEASH;
    }
    knob.style.transform = `translate(${dx / LEASH * 14}px, ${dy / LEASH * 14}px)`;
    if (len > DEAD) {
      const h = dx > 0 ? "right" : "left", v = dy > 0 ? "down" : "up";
      const ax = Math.abs(dx), ay = Math.abs(dy);
      const main = ax > ay ? h : v, other = ax > ay ? v : h;
      const diag = Math.min(ax, ay) > Math.max(ax, ay) * 0.5;
      const key = main + (diag ? other : "");
      if (key !== joyDir) { joyDir = key; steer(main, diag ? other : null); }
    }
  }
  zone.addEventListener("pointerdown", e => {
    e.preventDefault(); audio();
    joyId = e.pointerId; joyDir = null; ox = e.clientX; oy = e.clientY;
    try { zone.setPointerCapture(e.pointerId); } catch (err) {}
    joy.classList.add("active");
  });
  zone.addEventListener("pointermove", e => { if (e.pointerId === joyId) { e.preventDefault(); joyMove(e); } });
  const joyEnd = e => {
    if (e.pointerId !== joyId) return;
    joyId = null; joyDir = null; joy.classList.remove("active"); knob.style.transform = "";
  };
  zone.addEventListener("pointerup", joyEnd);
  zone.addEventListener("pointercancel", joyEnd);
  pauseBtn.addEventListener("click", () => { togglePause(); try { window.focus(); } catch (e) {} });
  const layoutBtn = document.getElementById("layoutBtn");
  const layoutLabel = () => { layoutBtn.textContent = layout === "vertical" ? "Labirinto: em pé" : "Labirinto: quadrado"; };
  layoutLabel();
  layoutBtn.addEventListener("click", () => {
    setLayout(layout === "vertical" ? "classic" : "vertical");
    try { localStorage.setItem("claquete-layout", layout); } catch (e) {}
    layoutLabel();
    state = "title"; buildGrid(); resetPositions(); resize(); updateHud(); titleScreen();
  });
  muteBtn.addEventListener("click", () => {
    muted = !muted; muteBtn.textContent = muted ? "Som: desligado" : "Som: ligado";
    if (!muted) audio();
  });
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") togglePause(); });
  // se o jogo perde o foco do teclado, pausa e avisa, em vez de ignorar as setas em silêncio
  window.addEventListener("blur", () => { if (state === "play") togglePause(); });
  // botões não ficam selecionados depois do clique (senão o espaço aciona o botão)
  document.querySelectorAll(".ghost-btn").forEach(b => b.addEventListener("click", () => setTimeout(() => b.blur(), 0)));

  // ---------- Início ----------
  buildGrid();
  resetPositions();
  resize();
  updateHud();
  titleScreen();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderMaze());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
